services:
  app:
    image: node:22-alpine
    working_dir: /app
    command: [sh, -c, "npm ci && npm run dev:app"]
    environment:
      APP_HOST: "${KOOL_PROXY_HOST:-demo.localhost}"
      VITE_PUBLIC_ORIGIN: "http://${KOOL_PROXY_HOST:-demo.localhost}:3001"
      DB_HOST: demo-database
      REDIS_URL: redis://demo-cache:6379
    volumes:
      - .:/app
      - app_modules:/app/node_modules
    networks: [local, kool_global]

  node:
    image: node:22-alpine
    working_dir: /app
    command: [sh, -c, "npm ci && npm run dev"]
    environment:
      VITE_PUBLIC_ORIGIN: "http://${KOOL_PROXY_HOST:-demo.localhost}:3001"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    networks: [local, kool_global]

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    volumes:
      - database:/var/lib/postgresql/data
    networks:
      local:
      kool_global:
        aliases: [demo-database]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U demo -d demo"]
      interval: 2s
      timeout: 3s
      retries: 20

  cache:
    image: redis:7-alpine
    networks:
      local:
      kool_global:
        aliases: [demo-cache]

volumes:
  app_modules:
  node_modules:
  database:

networks:
  local:
  kool_global:
    external: true
    name: "${KOOL_GLOBAL_NETWORK:-kool_global}"
